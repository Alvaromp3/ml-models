# Render Blueprint — repo: https://github.com/Alvaromp3/ml-models
# Dashboard: New → Blueprint → Connect repo → Render picks this file from the repo root.
#
# After deploy, set secrets in the Render dashboard (Environment):
#   Backend:  ALLOWED_ORIGINS, OPEN_ROUTER_API_KEY, API_KEY (optional), DISABLE_MODEL_TRAINING=1, ENVIRONMENT=production
#   Frontend: VITE_API_BASE_URL (build-time), VITE_API_KEY only if you use API_KEY (see RENDER.md — leaks in bundle)
#
# Persistent CSV/models: add a Render Disk and mount it; set DATA_STORE_DIR to the mount path (backend).

services:
  - type: web
    name: graceland-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: graceland_soccer_model/graceland_soccer_web/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DISABLE_MODEL_TRAINING
        value: "1"
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        sync: false
      - key: OPEN_ROUTER_API_KEY
        sync: false
      - key: API_KEY
        sync: false

  - type: web
    name: graceland-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: graceland_soccer_model/graceland_soccer_web/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_API_KEY
        sync: false
